kind = "web"
previewPath = "/"
title = "SoftKeys Store"
version = "1.0.0"
id = "artifacts/softkeys-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24346

[services.development]
run = "pnpm --filter @workspace/softkeys-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/softkeys-store", "run", "build" ]
publicDir = "artifacts/softkeys-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24346"
BASE_PATH = "/"
